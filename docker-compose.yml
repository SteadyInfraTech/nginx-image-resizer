services:
  origin:
    build:
      context: .
      dockerfile: demo/Dockerfile
    expose: ["8081"]

  nginx:
    build:
      context: .
      args:
        NGINX_CONFIG: nginx.conf
        NGINX_CACHE_VALIDITY: ${NGINX_CACHE_VALIDITY:-1s}
        NGINX_ORIGIN_UPSTREAM: ${NGINX_ORIGIN_UPSTREAM:-origin:8081}
        NGINX_URI_STYLE: ${NGINX_URI_STYLE:-prefix}
    ports: ["${NGINX_HOST_PORT:-8080}:8080"]
    depends_on: [origin]
    # Keep the image filesystem immutable at runtime. NGINX needs writable
    # space only for its PID, cache, and temporary files.
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /run/nginx:rw,noexec,nosuid,size=1m,mode=0755
      - /var/lib/nginx/tmp:rw,noexec,nosuid,size=16m,mode=1777
      - /var/cache/nginx:rw,noexec,nosuid,size=${NGINX_CACHE_TMPFS_SIZE:-96m},mode=1777
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 20

  tests:
    build:
      context: .
      dockerfile: tests/Dockerfile
    environment:
      BASE_URL: http://nginx:8080
      ORIGIN_CONTROL_URL: http://origin:8081
      URI_STYLE: ${NGINX_URI_STYLE:-prefix}
    depends_on:
      nginx:
        condition: service_healthy
    command: ["python", "-m", "unittest", "discover", "-s", "tests", "-v"]
