services:
  validator:
    build:
      context: .
      dockerfile: validator/Dockerfile
    environment:
      ORIGIN_URL: http://origin:8081
      MAX_SOURCE_BYTES: "8388608"
      MAX_SOURCE_PIXELS: "16777216"
      MAX_SOURCE_DIMENSION: "8192"
    depends_on: [origin]
    expose: ["8082"]
    read_only: true
    security_opt:
      - no-new-privileges:true

  nginx:
    build:
      args:
        NGINX_ORIGIN_UPSTREAM: validator:8082
    depends_on: [origin, validator]

  tests:
    environment:
      VALIDATED_ORIGIN: "1"
