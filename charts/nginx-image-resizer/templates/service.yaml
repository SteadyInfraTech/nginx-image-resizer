apiVersion: v1
kind: Service
metadata:
  name: {{ include "nginx-image-resizer.fullname" . }}
  labels:
    {{- include "nginx-image-resizer.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "nginx-image-resizer.selectorLabels" . | nindent 4 }}
