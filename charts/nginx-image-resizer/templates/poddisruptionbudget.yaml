{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "nginx-image-resizer.fullname" . }}
  labels:
    {{- include "nginx-image-resizer.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "nginx-image-resizer.selectorLabels" . | nindent 6 }}
{{- end }}
