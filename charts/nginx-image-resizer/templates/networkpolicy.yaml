{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nginx-image-resizer.fullname" . }}-egress
  labels:
    {{- include "nginx-image-resizer.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "nginx-image-resizer.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    # Allow the configured in-cluster origin. Override these selectors to match
    # the origin's actual pod and namespace labels in the target cluster.
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.origin.namespaceLabels | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.origin.podLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.origin.port }}
    # DNS is required to resolve the configured origin hostname.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- with .Values.networkPolicy.extraEgress }}
    # Optional additional egress rules for external origins or required services.
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}