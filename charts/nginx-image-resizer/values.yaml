replicaCount: 2

# URI contract: prefix (/77x77/path.jpg) or suffix (/path.jpg/_resize/77x77).
uriStyle: prefix

image:
  repository: ghcr.io/steadyinfratech/nginx-image-resizer
  # "main" is for pre-release development. Pin a version tag or digest for releases.
  tag: main
  digest: ""
  pullPolicy: Always

origin:
  # Must resolve from the pod before NGINX starts.
  host: origin
  port: 8081

service:
  type: ClusterIP
  port: 8080

serviceAccount:
  create: true
  name: ""

imagePullSecrets: []

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

nginx:
  workerConnections: 256
  maxConcurrentImageRequests: 4
  cache:
    maxSize: 64m
    inactive: 10m
    validity: 10m
    emptyDirSizeLimit: 128Mi
  imageFilter:
    buffer: 8M
  tempSizeLimit: 64Mi
  tmpSizeLimit: 16Mi
  runSizeLimit: 4Mi

resources:
  requests:
    cpu: 100m
    memory: 128Mi
    ephemeral-storage: 64Mi
  limits:
    cpu: "1"
    memory: 512Mi
    ephemeral-storage: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}
