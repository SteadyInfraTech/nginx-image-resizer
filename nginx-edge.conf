worker_processes auto;
pid /run/nginx/nginx.pid;

events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    error_log /dev/stderr notice;

    proxy_cache_path /var/cache/nginx/image levels=1:2 keys_zone=image_cache:10m
        max_size=64m inactive=10m use_temp_path=off;

    upstream image_transformer {
        server transformer:8082;
        keepalive 8;
    }

    server {
        listen 8080;
        server_name _;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location ~ ^/(?<width>204[0-8]|20[0-3][0-9]|1[0-9]{3}|[1-9][0-9]{0,2})x(?<height>204[0-8]|20[0-3][0-9]|1[0-9]{3}|[1-9][0-9]{0,2})/(?<image_path>.+)$ {
            if ($image_path ~ "(^|/)\\.\\.?(/|$)") { return 400; }

            proxy_cache image_cache;
            proxy_cache_key "$scheme$proxy_host$uri";
            proxy_cache_valid 200 10m;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 10s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

            add_header X-Cache-Status $upstream_cache_status always;
            proxy_set_header Host $host;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_pass http://image_transformer;
        }

        location / { return 400; }
    }
}
