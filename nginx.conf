load_module /usr/lib/nginx/modules/ngx_http_image_filter_module.so;

user nginx;
worker_processes auto;
pid /run/nginx/nginx.pid;

events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    error_log /dev/stderr notice;

    # ?bypass_cache=1 (also true/yes) skips both cache lookup and storage.
    map $arg_bypass_cache $skip_image_cache {
        default 0;
        1       1;
        true    1;
        yes     1;
    }

    # Shared per-instance cap on active image requests; tune at build time.
    limit_conn_zone $server_name zone=image_requests:1m;

    proxy_cache_path /var/cache/nginx/image levels=1:2 keys_zone=image_cache:10m
        max_size=64m inactive=10m use_temp_path=off;

    upstream image_origin {
        server origin:8081;
        keepalive 8;
    }

    server {
        listen 8080;
        server_name _;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location ~ ^/(?<edge_width>[1-9][0-9]?[0-9]?|1[0-9][0-9][0-9]|20[0-3][0-9]|204[0-8])x(?<edge_height>[1-9][0-9]?[0-9]?|1[0-9][0-9][0-9]|20[0-3][0-9]|204[0-8])/(?<edge_image_path>.+)$ {
            if ($edge_image_path ~ "(^|/)\\.\\.?(/|$)") { return 400; }

            # Reject excess concurrent image work instead of allowing unbounded bursts.
            limit_conn image_requests 16;
            limit_conn_status 503;

            proxy_cache image_cache;
            proxy_cache_key "$scheme$proxy_host$uri$is_args$args";
            proxy_cache_bypass $skip_image_cache;
            proxy_no_cache $skip_image_cache;
            proxy_cache_valid 200 10m;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 10s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

            add_header X-Cache-Status $upstream_cache_status always;
            proxy_set_header Host $host;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_pass http://127.0.0.1:8082;
        }

        location / { return 400; }
    }

    server {
        listen 127.0.0.1:8082;
        server_name _;
        # The public edge logs each client request; avoid duplicate internal entries.
        access_log off;
        error_log /dev/stderr notice;

        location ~ ^/(?<width>[1-9][0-9]?[0-9]?|1[0-9][0-9][0-9]|20[0-3][0-9]|204[0-8])x(?<height>[1-9][0-9]?[0-9]?|1[0-9][0-9][0-9]|20[0-3][0-9]|204[0-8])/(?<image_path>.+)$ {
            if ($image_path ~ "(^|/)\\.\\.?(/|$)") { return 400; }

            image_filter resize $width $height;
            image_filter_buffer 8M;
            proxy_intercept_errors on;
            error_page 404 = @origin_not_found;
            error_page 503 = @origin_unavailable;
            # The origin is fixed; never let the client choose its virtual host.
            # Keep origin negotiation independent of client Accept; it is not part of the cache key.
            proxy_set_header Accept "image/png, image/jpeg, image/gif";
            proxy_set_header Host origin;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_pass http://image_origin/$image_path$is_args$args;
        }

        location @origin_not_found {
            return 404;
        }

        location @origin_unavailable {
            return 503;
        }

        location / { return 400; }
    }
}
