load_module /usr/lib/nginx/modules/ngx_http_image_filter_module.so;

worker_processes auto;
pid /run/nginx/nginx.pid;

events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    error_log /dev/stderr notice;

    upstream image_origin {
        server origin:8081;
        keepalive 8;
    }

    server {
        listen 8082;
        server_name _;

        location ~ ^/(?<width>204[0-8]|20[0-3][0-9]|1[0-9]{3}|[1-9][0-9]{0,2})x(?<height>204[0-8]|20[0-3][0-9]|1[0-9]{3}|[1-9][0-9]{0,2})/(?<image_path>.+)$ {
            if ($image_path ~ "(^|/)\\.\\.?(/|$)") { return 400; }

            image_filter resize $width $height;
            image_filter_buffer 8M;
            proxy_set_header Host $host;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_pass http://image_origin/$image_path;
        }

        location / { return 400; }
    }
}
