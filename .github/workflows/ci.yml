name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Validate Helm chart release metadata
        run: |
          python3 tools/validate_chart_release.py
          python3 tools/validate_chart_release.py --expected-app-version 0.1.0
          if python3 tools/validate_chart_release.py --expected-app-version 9.9.9; then
            echo "mismatched appVersion unexpectedly passed validation" >&2
            exit 1
          fi
      - name: Validate Compose configurations
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.validated.yml config --quiet
      - name: Check benchmark and release validator syntax
        run: python3 -m py_compile tools/benchmark.py tools/validate_chart_release.py
      - name: Build and run integration tests
        run: docker compose up --build --abort-on-container-exit --exit-code-from tests
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Clean up
        if: always()
        run: docker compose down --volumes --remove-orphans

  suffix-uri-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Verify invalid URI style is rejected at build time
        run: |
          docker build -t image-resizer-uri-style-test .
          if docker run --rm -e NGINX_URI_STYLE=invalid image-resizer-uri-style-test; then
            echo "invalid URI style unexpectedly started successfully" >&2
            exit 1
          fi
      - name: Build and run suffix-style integration tests
        env:
          NGINX_URI_STYLE: suffix
        run: docker compose up --build --abort-on-container-exit --exit-code-from tests
      - name: Show logs on failure
        if: failure()
        env:
          NGINX_URI_STYLE: suffix
        run: docker compose logs --no-color
      - name: Clean up
        if: always()
        env:
          NGINX_URI_STYLE: suffix
        run: docker compose down --volumes --remove-orphans

  validated-input-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build and run optional validated-origin integration suite
        run: docker compose -f docker-compose.yml -f docker-compose.validated.yml up --build --abort-on-container-exit --exit-code-from tests
      - name: Show logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.validated.yml logs --no-color
      - name: Clean up
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.validated.yml down --volumes --remove-orphans

  direct-tls-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Generate ephemeral test certificate
        run: |
          mkdir -p "$RUNNER_TEMP/image-resizer-tls"
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout "$RUNNER_TEMP/image-resizer-tls/tls.key" \
            -out "$RUNNER_TEMP/image-resizer-tls/tls.crt" \
            -subj "/CN=localhost"
          sudo chown root:root "$RUNNER_TEMP/image-resizer-tls/tls.key" "$RUNNER_TEMP/image-resizer-tls/tls.crt"
          sudo chmod 600 "$RUNNER_TEMP/image-resizer-tls/tls.key"
          sudo chmod 644 "$RUNNER_TEMP/image-resizer-tls/tls.crt"
      - name: Validate invalid build arguments fail fast
        run: |
          if docker build --build-arg NGINX_MAX_CONCURRENT_IMAGE_REQUESTS=not-a-number -t invalid-concurrency-test .; then
            echo "invalid concurrency build argument was accepted" >&2
            exit 1
          fi
          if docker build --build-arg NGINX_CACHE_VALIDITY="10m; echo injected" -t invalid-cache-ttl-test .; then
            echo "invalid cache TTL build argument was accepted" >&2
            exit 1
          fi
          if docker build --build-arg NGINX_ORIGIN_UPSTREAM="origin:8081; return 200" -t invalid-origin-upstream-test .; then
            echo "invalid origin upstream was accepted" >&2
            exit 1
          fi
      - name: Build direct-TLS and demo-origin images
        run: |
          docker build --build-arg NGINX_CONFIG=nginx-direct-tls.conf -t steady-nginx-image-resizer:direct-tls .
          docker build -f demo/Dockerfile -t steady-nginx-image-resizer-demo-origin .
      - name: Test direct-TLS routing, resizing, cache, and hardened runtime
        run: |
          set -eu
          network=direct-tls-smoke-net
          docker network create "$network"
          docker run -d --name direct-tls-origin --network "$network" --network-alias origin steady-nginx-image-resizer-demo-origin
          origin_ready=0
          for attempt in $(seq 1 20); do
            if docker exec direct-tls-origin python -c 'from urllib.request import urlopen; r=urlopen("http://127.0.0.1:8081/sample.png", timeout=1); assert r.status == 200 and r.headers.get_content_type() == "image/png"; r.read(8)' ; then origin_ready=1; break; fi
            sleep 1
          done
          test "$origin_ready" = "1"
          docker run --rm --network "$network" -v "$RUNNER_TEMP/image-resizer-tls:/etc/nginx/tls:ro" steady-nginx-image-resizer:direct-tls nginx -t
          docker run -d --name direct-tls-smoke --network "$network" \
            --read-only --cap-drop ALL --cap-add CHOWN --cap-add SETUID --cap-add SETGID --cap-add NET_BIND_SERVICE \
            --security-opt no-new-privileges:true \
            --tmpfs /run/nginx:rw,noexec,nosuid,size=1m,mode=0755 \
            --tmpfs /var/lib/nginx/tmp:rw,noexec,nosuid,size=16m,mode=1777 \
            --tmpfs /var/cache/nginx:rw,noexec,nosuid,size=96m,mode=1777 \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m,mode=1777 \
            -p 18080:80 -p 18443:443 -v "$RUNNER_TEMP/image-resizer-tls:/etc/nginx/tls:ro" steady-nginx-image-resizer:direct-tls
          cleanup() {
            docker logs direct-tls-smoke 2>/dev/null || true
            docker logs direct-tls-origin 2>/dev/null || true
            docker rm -f direct-tls-smoke direct-tls-origin >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 20); do
            if curl -ksS -o /dev/null https://127.0.0.1:18443/healthz; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = "1"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/healthz)" = "200"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/77x77/sample.png)" = "301"
          curl -sS -D "$RUNNER_TEMP/host-redirect-headers.txt" -o /dev/null -H 'Host: attacker.example' http://127.0.0.1:18080/redirect-check
          grep -qi '^Location: https://localhost/redirect-check' "$RUNNER_TEMP/host-redirect-headers.txt"
          test "$(curl -ksS -o /dev/null -w '%{http_code}' https://127.0.0.1:18443/healthz)" = "200"
          test "$(curl -ksS -o /dev/null -w '%{http_code}' https://127.0.0.1:18443/0x10/sample.png)" = "400"
          test "$(curl -ksS -o /dev/null -w '%{http_code}' https://127.0.0.1:18443/2049x10/sample.png)" = "400"
          traversal_status="$(curl --path-as-is -ksS -o /dev/null -w '%{http_code}' https://127.0.0.1:18443/77x77/../sample.png)"
          case "$traversal_status" in 400|404) ;; *) echo "unexpected traversal status: $traversal_status" >&2; exit 1 ;; esac
          curl -ksS -D "$RUNNER_TEMP/first-headers.txt" -o "$RUNNER_TEMP/resized.png" https://127.0.0.1:18443/77x77/sample.png
          grep -qi '^X-Cache-Status: MISS' "$RUNNER_TEMP/first-headers.txt"
          python -c 'import pathlib,struct; data=pathlib.Path("'$RUNNER_TEMP'/resized.png").read_bytes(); assert data[:8] == bytes.fromhex("89504e470d0a1a0a"), "response is not PNG"; w,h=struct.unpack(">II",data[16:24]); assert (w,h)==(77,57), f"unexpected resized dimensions: {w}x{h}"'
          curl -ksS -D "$RUNNER_TEMP/second-headers.txt" -o "$RUNNER_TEMP/resized-again.png" https://127.0.0.1:18443/77x77/sample.png
          grep -qi '^X-Cache-Status: HIT' "$RUNNER_TEMP/second-headers.txt"
          cmp "$RUNNER_TEMP/resized.png" "$RUNNER_TEMP/resized-again.png"

  benchmark-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Start local demo stack
        run: |
          docker compose up --build -d nginx origin
          ready=0
          for attempt in $(seq 1 30); do
            if [ "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/77x77/sample.png)" = "200" ]; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = "1"
      - name: Run bounded benchmark smoke scenarios
        run: |
          set -eu
          base_url=http://127.0.0.1:8080
          path=/77x77/sample.png
          requests=40
          concurrency=4
          curl -fsS -o /dev/null "$base_url$path"
          for mode in hit bypass unique stampede; do
            report="$RUNNER_TEMP/benchmark-$mode.json"
            python3 tools/benchmark.py --base-url "$base_url" --path "$path" --requests "$requests" --concurrency "$concurrency" --timeout 3 --mode "$mode" > "$report"
            MODE="$mode" REQUESTS="$requests" REPORT="$report" python3 - <<'PY'
          import json, os
          from pathlib import Path
          mode = os.environ["MODE"]
          expected_requests = int(os.environ["REQUESTS"])
          report = json.loads(Path(os.environ["REPORT"]).read_text())
          assert report["requests_completed"] == expected_requests, report
          assert report["http_status_counts"] == {"200": expected_requests}, report
          if mode == "stampede":
              assert report["cache_status_counts"] == {"HIT": expected_requests - 1, "MISS": 1}, report
          else:
              expected_cache = {"hit": "HIT", "bypass": "BYPASS", "unique": "MISS"}[mode]
              assert report["cache_status_counts"] == {expected_cache: expected_requests}, report
          assert not report["errors"], report
          PY
          done
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Clean up
        if: always()
        run: docker compose down --volumes --remove-orphans
