name: Helm Kubernetes smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  helm-kubernetes-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: Create kind cluster
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: image-resizer
      - name: Lint and render chart
        run: |
          helm lint charts/nginx-image-resizer
          helm template resizer charts/nginx-image-resizer --set origin.host=origin --set image.tag=ci > "$RUNNER_TEMP/rendered.yaml"
          grep -q 'image_filter resize' "$RUNNER_TEMP/rendered.yaml"
      - name: Build and load application and test-origin images
        run: |
          docker build -t steady-image-resizer:ci .
          docker build -f demo/Dockerfile -t steady-image-resizer-demo-origin:ci .
          kind load docker-image --name image-resizer steady-image-resizer:ci
          kind load docker-image --name image-resizer steady-image-resizer-demo-origin:ci
      - name: Install test origin and chart
        run: |
          kubectl create deployment origin --image=steady-image-resizer-demo-origin:ci
          kubectl expose deployment origin --port=8081 --target-port=8081
          kubectl rollout status deployment/origin --timeout=120s
          helm upgrade --install resizer charts/nginx-image-resizer \
            --set image.repository=steady-image-resizer \
            --set image.tag=ci \
            --set image.pullPolicy=IfNotPresent \
            --set origin.host=origin \
            --set replicaCount=1 \
            --wait --timeout=180s
          kubectl rollout status deployment/resizer-nginx-image-resizer --timeout=120s
      - name: Diagnose Kubernetes startup failures
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl get events --sort-by=.lastTimestamp || true
          kubectl describe pods || true
          kubectl logs deployment/resizer-nginx-image-resizer --all-containers=true --tail=200 || true
          kubectl logs deployment/origin --all-containers=true --tail=100 || true
      - name: Verify resize, cache hit, and Helm upgrade
        run: |
          set -eu
          kubectl port-forward service/resizer-nginx-image-resizer 18080:8080 > "$RUNNER_TEMP/port-forward.log" 2>&1 &
          port_forward_pid=$!
          cleanup() { kill "$port_forward_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = "1"
          curl -fsS -D "$RUNNER_TEMP/first.headers" -o "$RUNNER_TEMP/resized.png" http://127.0.0.1:18080/77x77/sample.png
          grep -qi '^X-Cache-Status: MISS' "$RUNNER_TEMP/first.headers"
          curl -fsS -D "$RUNNER_TEMP/second.headers" -o "$RUNNER_TEMP/resized-again.png" http://127.0.0.1:18080/77x77/sample.png
          grep -qi '^X-Cache-Status: HIT' "$RUNNER_TEMP/second.headers"
          cmp "$RUNNER_TEMP/resized.png" "$RUNNER_TEMP/resized-again.png"
          python3 - "$RUNNER_TEMP/resized.png" <<'PY'
          import struct, sys
          data = open(sys.argv[1], "rb").read()
          assert data[:8] == bytes.fromhex("89504e470d0a1a0a"), "response is not PNG"
          width, height = struct.unpack(">II", data[16:24])
          assert (width, height) == (77, 57), f"unexpected dimensions: {width}x{height}"
          print(f"kind smoke passed: {width}x{height}, cache miss/hit verified")
          PY
          helm upgrade resizer charts/nginx-image-resizer \
            --set image.repository=steady-image-resizer \
            --set image.tag=ci \
            --set image.pullPolicy=IfNotPresent \
            --set origin.host=origin \
            --set replicaCount=2 \
            --wait --timeout=180s
          kubectl rollout status deployment/resizer-nginx-image-resizer --timeout=120s
          curl -fsS http://127.0.0.1:18080/healthz >/dev/null
