name: Ingress drain propagation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingress-drain-propagation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: Create kind cluster
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: ingress-drain
      - name: Build and load application and origin images
        run: |
          set -euo pipefail
          docker build -t steady-image-resizer:ingress-drain .
          docker build -f demo/Dockerfile -t steady-image-resizer-demo-origin:ingress-drain .
          kind load docker-image --name ingress-drain steady-image-resizer:ingress-drain
          kind load docker-image --name ingress-drain steady-image-resizer-demo-origin:ingress-drain
      - name: Install ingress-nginx controller
        run: |
          set -euo pipefail
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo update ingress-nginx
          helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
            --version 4.12.1 \
            --namespace ingress-nginx --create-namespace \
            --set controller.replicaCount=1 \
            --set controller.service.type=ClusterIP \
            --set controller.admissionWebhooks.enabled=false \
            --wait --timeout=240s
          kubectl rollout status deployment/ingress-nginx-controller -n ingress-nginx --timeout=180s
      - name: Deploy origin, resizer and Ingress route
        run: |
          set -euo pipefail
          kubectl create deployment origin --image=steady-image-resizer-demo-origin:ingress-drain
          kubectl expose deployment origin --port=8081 --target-port=8081
          kubectl rollout status deployment/origin --timeout=120s
          helm upgrade --install resizer charts/nginx-image-resizer \
            --set image.repository=steady-image-resizer \
            --set image.tag=ingress-drain \
            --set image.pullPolicy=IfNotPresent \
            --set origin.host=origin \
            --set replicaCount=2 \
            --wait --timeout=180s
          cat <<'EOF' | kubectl apply -f -
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: resizer
            annotations:
              nginx.ingress.kubernetes.io/proxy-read-timeout: "15"
          spec:
            ingressClassName: nginx
            rules:
              - host: images.test
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: resizer-nginx-image-resizer
                          port:
                            number: 8080
          EOF
      - name: Verify ingress routing and pod replacement without request failures
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            if [ -n "${port_forward_pid:-}" ]; then
              kill "$port_forward_pid" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT
          kubectl port-forward -n ingress-nginx service/ingress-nginx-controller 18080:80 > "$RUNNER_TEMP/ingress-port-forward.log" 2>&1 &
          port_forward_pid=$!
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS -H 'Host: images.test' 'http://127.0.0.1:18080/77x77/sample.png?ingress-baseline=1' -o "$RUNNER_TEMP/baseline.png"; then
              ready=1
              break
            fi
            if ! kill -0 "$port_forward_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/ingress-port-forward.log" >&2 || true
              exit 1
            fi
            sleep 1
          done
          test "$ready" = 1
          python3 - "$RUNNER_TEMP/baseline.png" <<'PY'
          import struct, sys
          data = open(sys.argv[1], "rb").read()
          assert data[:8] == bytes.fromhex("89504e470d0a1a0a"), "ingress baseline response is not PNG"
          assert struct.unpack(">II", data[16:24]) == (77, 57), "ingress baseline dimensions mismatch"
          PY
          test "$(kubectl get deployment resizer-nginx-image-resizer -o jsonpath='{.status.readyReplicas}')" = 2
          pod="$(kubectl get pods -l app.kubernetes.io/instance=resizer -o jsonpath='{.items[0].metadata.name}')"
          test -n "$pod"
          kubectl delete pod "$pod" --wait=false
          successes=0
          for request_id in $(seq 1 20); do
            file="$RUNNER_TEMP/ingress-$request_id.png"
            if ! curl -fsS --max-time 8 -H 'Host: images.test' "http://127.0.0.1:18080/77x77/sample.png?ingress-drain=$request_id" -o "$file"; then
              cat "$RUNNER_TEMP/ingress-port-forward.log" >&2 || true
              kubectl get pods -o wide >&2 || true
              kubectl get endpoints resizer-nginx-image-resizer -o yaml >&2 || true
              kubectl logs deployment/ingress-nginx-controller -n ingress-nginx --tail=100 >&2 || true
              echo "Ingress request $request_id failed during resizer pod replacement" >&2
              exit 1
            fi
            python3 - "$file" <<'PY'
          import struct, sys
          data = open(sys.argv[1], "rb").read()
          assert data[:8] == bytes.fromhex("89504e470d0a1a0a"), "ingress response is not PNG"
          assert struct.unpack(">II", data[16:24]) == (77, 57), "ingress response dimensions mismatch"
          PY
            successes=$((successes + 1))
            sleep 0.25
          done
          kubectl rollout status deployment/resizer-nginx-image-resizer --timeout=180s
          test "$(kubectl get deployment resizer-nginx-image-resizer -o jsonpath='{.status.readyReplicas}')" = 2
          for request_id in $(seq 21 30); do
            curl -fsS --max-time 8 -H 'Host: images.test' "http://127.0.0.1:18080/77x77/sample.png?ingress-recovered=$request_id" -o "$RUNNER_TEMP/ingress-$request_id.png"
            python3 - "$RUNNER_TEMP/ingress-$request_id.png" <<'PY'
          import struct, sys
          data = open(sys.argv[1], "rb").read()
          assert data[:8] == bytes.fromhex("89504e470d0a1a0a"), "recovered ingress response is not PNG"
          assert struct.unpack(">II", data[16:24]) == (77, 57), "recovered ingress dimensions mismatch"
          PY
          done
          echo "Ingress drain propagation passed: 30 valid image requests and replacement replica readiness verified."
      - name: Diagnose ingress failures
        if: failure()
        run: |
          kubectl get nodes -o wide || true
          kubectl get pods -A -o wide || true
          kubectl get ingress,endpoints -A -o yaml || true
          kubectl get events -A --sort-by=.lastTimestamp || true
          kubectl logs deployment/ingress-nginx-controller -n ingress-nginx --tail=200 || true
          kubectl logs deployment/resizer-nginx-image-resizer --all-containers=true --tail=200 || true
          kubectl logs deployment/origin --all-containers=true --tail=100 || true
