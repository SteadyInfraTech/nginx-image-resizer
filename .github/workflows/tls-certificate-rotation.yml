name: TLS certificate rotation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tls-certificate-rotation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Generate two valid certificate/key pairs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tls-rotation"
          for version in first second; do
            openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
              -keyout "$RUNNER_TEMP/tls-rotation/$version.key" \
              -out "$RUNNER_TEMP/tls-rotation/$version.crt" \
              -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost"
          done
          install -m 600 "$RUNNER_TEMP/tls-rotation/first.key" "$RUNNER_TEMP/tls-rotation/tls.key"
          install -m 644 "$RUNNER_TEMP/tls-rotation/first.crt" "$RUNNER_TEMP/tls-rotation/tls.crt"
          chmod 600 "$RUNNER_TEMP/tls-rotation/second.key"
          chmod 644 "$RUNNER_TEMP/tls-rotation/second.crt"
          sudo chown root:root "$RUNNER_TEMP"/tls-rotation/*
      - name: Build direct-TLS image
        run: docker build --build-arg NGINX_CONFIG=nginx-direct-tls.conf --build-arg NGINX_PUBLIC_HOST=localhost -t steady-nginx-image-resizer:tls-rotation .
      - name: Rotate the mounted certificate and verify the live TLS endpoint
        shell: bash
        run: |
          set -euo pipefail
          cleanup() { docker rm -f tls-rotation >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --name tls-rotation \
            --read-only \
            --cap-drop ALL --cap-add CHOWN --cap-add SETUID --cap-add SETGID --cap-add NET_BIND_SERVICE \
            --security-opt no-new-privileges:true \
            --add-host origin:127.0.0.1 \
            --tmpfs /run/nginx:rw,noexec,nosuid,size=1m,mode=0755 \
            --tmpfs /var/lib/nginx/tmp:rw,noexec,nosuid,size=16m,mode=1777 \
            --tmpfs /var/cache/nginx:rw,noexec,nosuid,size=96m,mode=1777 \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m,mode=1777 \
            -p 127.0.0.1:8443:443 \
            -v "$RUNNER_TEMP/tls-rotation:/etc/nginx/tls:ro" \
            steady-nginx-image-resizer:tls-rotation
          presented_serial() {
            timeout 5 openssl s_client -connect 127.0.0.1:8443 -servername localhost </dev/null 2>/dev/null |
              openssl x509 -noout -serial 2>/dev/null | sed 's/^serial=//'
          }
          expected_first="$(openssl x509 -in "$RUNNER_TEMP/tls-rotation/first.crt" -noout -serial | sed 's/^serial=//')"
          expected_second="$(openssl x509 -in "$RUNNER_TEMP/tls-rotation/second.crt" -noout -serial | sed 's/^serial=//')"
          test "$expected_first" != "$expected_second"
          first_seen=""
          for attempt in $(seq 1 30); do
            first_seen="$(presented_serial || true)"
            [ "$first_seen" = "$expected_first" ] && break
            sleep 1
          done
          test "$first_seen" = "$expected_first"
          # Update files in the mounted directory; the read-only bind mount still
          # reflects host-side certificate-manager changes. Preserve file modes.
          install -m 644 "$RUNNER_TEMP/tls-rotation/second.crt" "$RUNNER_TEMP/tls-rotation/tls.crt.next"
          install -m 600 "$RUNNER_TEMP/tls-rotation/second.key" "$RUNNER_TEMP/tls-rotation/tls.key.next"
          mv "$RUNNER_TEMP/tls-rotation/tls.crt.next" "$RUNNER_TEMP/tls-rotation/tls.crt"
          mv "$RUNNER_TEMP/tls-rotation/tls.key.next" "$RUNNER_TEMP/tls-rotation/tls.key"
          sudo chown root:root "$RUNNER_TEMP/tls-rotation/tls.crt" "$RUNNER_TEMP/tls-rotation/tls.key"
          docker exec tls-rotation nginx -t -c /run/nginx/nginx.conf
          docker exec tls-rotation nginx -s reload -c /run/nginx/nginx.conf
          second_seen=""
          for attempt in $(seq 1 30); do
            second_seen="$(presented_serial || true)"
            [ "$second_seen" = "$expected_second" ] && break
            sleep 1
          done
          if [ "$second_seen" != "$expected_second" ]; then
            docker logs tls-rotation >&2 || true
            echo "TLS endpoint did not present the replacement certificate after reload" >&2
            echo "Expected serial: $expected_second; observed: $second_seen" >&2
            exit 1
          fi
          echo "TLS rotation passed: live endpoint switched from $expected_first to $second_seen after NGINX reload."
