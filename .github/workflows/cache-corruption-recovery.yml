name: Cache corruption recovery

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cache-corruption-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Start hardened demo stack
        run: docker compose up --build -d nginx origin
      - name: Corrupt a warm cache entry and verify recovery
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            docker compose logs --no-color nginx origin || true
            docker compose down --volumes --remove-orphans
          }
          trap cleanup EXIT

          base=http://127.0.0.1:8080
          url="$base/77x77/sample.png?case=corrupt-cache-recovery"
          origin_ready=0
          for attempt in $(seq 1 30); do
            if docker compose exec -T origin python -c 'from urllib.request import urlopen; r=urlopen("http://127.0.0.1:8081/sample.png", timeout=1); assert r.status == 200; r.read(8)' >/dev/null 2>&1; then origin_ready=1; break; fi
            sleep 1
          done
          test "$origin_ready" = "1"

          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS "$base/healthz" >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = "1"

          curl -fsS -D "$RUNNER_TEMP/first.headers" -o "$RUNNER_TEMP/first.png" "$url"
          grep -qi '^X-Cache-Status: MISS' "$RUNNER_TEMP/first.headers"
          python3 - "$RUNNER_TEMP/first.png" <<'PY'
          import struct, sys
          data = open(sys.argv[1], "rb").read()
          assert data[:8] == bytes.fromhex("89504e470d0a1a0a"), "first response is not PNG"
          assert struct.unpack(">II", data[16:24]) == (77, 57), "first response dimensions unexpected"
          PY

          cache_file="$(docker compose exec -T -u 101:101 nginx sh -ec 'find /var/cache/nginx/image -type f -print -quit')"
          test -n "$cache_file"
          # Deliberately destroy the cache file after the valid MISS populated it.
          docker compose exec -T -u 101:101 nginx sh -ec "printf 'corrupted-cache-entry' > '$cache_file'"

          curl -fsS --max-time 10 -D "$RUNNER_TEMP/recovered.headers" -o "$RUNNER_TEMP/recovered.png" "$url"
          grep -qi '^X-Cache-Status: MISS' "$RUNNER_TEMP/recovered.headers"
          python3 - "$RUNNER_TEMP/recovered.png" <<'PY'
          import struct, sys
          data = open(sys.argv[1], "rb").read()
          assert data[:8] == bytes.fromhex("89504e470d0a1a0a"), "recovered response is not PNG"
          assert struct.unpack(">II", data[16:24]) == (77, 57), "recovered response dimensions unexpected"
          print("cache corruption recovery passed: valid origin response replaced damaged cache entry")
          PY

          curl -fsS -D "$RUNNER_TEMP/hit.headers" -o "$RUNNER_TEMP/hit.png" "$url"
          grep -qi '^X-Cache-Status: HIT' "$RUNNER_TEMP/hit.headers"
          cmp "$RUNNER_TEMP/recovered.png" "$RUNNER_TEMP/hit.png"
