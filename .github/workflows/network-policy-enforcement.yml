name: Network policy enforcement

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  network-policy-enforcement:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: Create kind cluster without default CNI
        run: |
          cat > "$RUNNER_TEMP/kind-network-policy.yaml" <<'YAML'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          networking:
            disableDefaultCNI: true
            podSubnet: 192.168.0.0/16
          YAML
          kind create cluster --name network-policy --config "$RUNNER_TEMP/kind-network-policy.yaml"
          # Wait for the API server, not Node Ready: with kindnet disabled, nodes
          # cannot become Ready until Calico is installed.
          api_ready=0
          for attempt in $(seq 1 60); do
            if kubectl get --raw="/readyz" >/dev/null 2>&1; then api_ready=1; break; fi
            sleep 2
          done
          test "$api_ready" = "1"
      - name: Install Calico policy-enforcing CNI
        run: |
          kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.29.3/manifests/calico.yaml
          kubectl rollout status daemonset/calico-node -n kube-system --timeout=240s
          kubectl rollout status deployment/calico-kube-controllers -n kube-system --timeout=240s
      - name: Build and load test images
        run: |
          docker build -t steady-image-resizer:ci .
          docker build -f demo/Dockerfile -t steady-image-resizer-demo-origin:ci .
          kind load docker-image --name network-policy steady-image-resizer:ci
          kind load docker-image --name network-policy steady-image-resizer-demo-origin:ci
      - name: Deploy allowed and disallowed destinations with enforced policy
        run: |
          set -eu
          kubectl create deployment origin --image=steady-image-resizer-demo-origin:ci
          kubectl expose deployment origin --port=8081 --target-port=8081
          kubectl create deployment blocked --image=steady-image-resizer-demo-origin:ci
          kubectl expose deployment blocked --port=8081 --target-port=8081
          # Same-label origin in another namespace must remain outside the allow-list.
          kubectl create namespace unrelated
          # The policy selects destination Pods, so put the matching label on the Pod
          # template itself. Keep the Deployment selector consistent with that label.
          cat <<'YAML' | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: origin-lookalike
            namespace: unrelated
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: origin
            template:
              metadata:
                labels:
                  app: origin
              spec:
                containers:
                  - name: origin
                    image: steady-image-resizer-demo-origin:ci
                    ports:
                      - containerPort: 8081
          YAML
          kubectl -n unrelated expose deployment origin-lookalike --port=8081 --target-port=8081 --name=origin-lookalike
          kubectl rollout status deployment/origin --timeout=120s
          kubectl rollout status deployment/blocked --timeout=120s
          kubectl -n unrelated rollout status deployment/origin-lookalike --timeout=120s
          helm upgrade --install resizer charts/nginx-image-resizer \
            --set image.repository=steady-image-resizer \
            --set image.tag=ci \
            --set image.pullPolicy=IfNotPresent \
            --set origin.host=origin \
            --set networkPolicy.enabled=true \
            --set networkPolicy.origin.podLabels.app=origin \
            --set-json 'networkPolicy.origin.namespaceLabels={"kubernetes.io/metadata.name":"default"}' \
            --set-json 'networkPolicy.extraEgress=[{"to":[{"ipBlock":{"cidr":"1.1.1.1/32"}}],"ports":[{"protocol":"TCP","port":443}]}]' \
            --wait --timeout=180s
          kubectl rollout status deployment/resizer-nginx-image-resizer --timeout=120s
      - name: Verify allowed origin and DNS work, while unrelated destination is blocked
        run: |
          set -eu
          pod="$(kubectl get pods -l app.kubernetes.io/instance=resizer,app.kubernetes.io/name=nginx-image-resizer -o jsonpath='{.items[0].metadata.name}')"
          test -n "$pod"
          # A real resize proves DNS and egress to the configured origin are allowed.
          kubectl port-forward service/resizer-nginx-image-resizer 18080:8080 > "$RUNNER_TEMP/port-forward.log" 2>&1 &
          port_forward_pid=$!
          trap 'kill "$port_forward_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = "1"
          curl -fsS -o "$RUNNER_TEMP/resize.png" http://127.0.0.1:18080/77x77/sample.png
          python3 - "$RUNNER_TEMP/resize.png" <<'PY'
          import struct, sys
          data = open(sys.argv[1], "rb").read()
          assert data[:8] == bytes.fromhex("89504e470d0a1a0a"), "allowed origin did not return PNG"
          width, height = struct.unpack(">II", data[16:24])
          assert (width, height) == (77, 57), f"unexpected dimensions: {width}x{height}"
          PY
          # Ensure the probe exists before treating a failed connection as policy enforcement.
          kubectl exec "$pod" -- sh -c 'command -v wget >/dev/null'
          # DNS may resolve the blocked Service, but its TCP connection must time out/fail.
          if kubectl exec "$pod" -- wget -T 4 -qO- http://blocked:8081/sample.png > /dev/null 2>&1; then
            echo "NetworkPolicy regression: resizer reached a disallowed destination" >&2
            exit 1
          fi
          # A matching pod label must not bypass the namespace selector.
          if kubectl exec "$pod" -- wget -T 4 -qO- http://origin-lookalike.unrelated.svc.cluster.local:8081/sample.png > /dev/null 2>&1; then
            echo "NetworkPolicy regression: resizer reached a matching-label origin in an unrelated namespace" >&2
            exit 1
          fi
          # Exercise networkPolicy.extraEgress with an external IP CIDR and TCP port.
          # 1.1.1.1 is a stable public HTTPS endpoint; ignore its certificate because
          # this probe tests policy reachability, not certificate validation.
          kubectl exec "$pod" -- sh -c "unset http_proxy https_proxy HTTP_PROXY HTTPS_PROXY all_proxy ALL_PROXY; exec wget --no-check-certificate --header='accept: application/dns-json' -T 8 -qO- 'https://1.1.1.1/dns-query?name=example.com&type=A'" > /dev/null
          # 1.0.0.1 is intentionally not allow-listed; the same TCP port must be blocked.
          # Clear proxy variables so this probe tests direct pod egress, not a proxy path.
          if kubectl exec "$pod" -- sh -c "unset http_proxy https_proxy HTTP_PROXY HTTPS_PROXY all_proxy ALL_PROXY; exec wget --no-check-certificate -T 4 -qO- 'https://1.0.0.1/dns-query?name=example.com&type=A'" > /dev/null 2>&1; then
            echo "NetworkPolicy regression: resizer reached an external IP outside extraEgress CIDRs" >&2
            exit 1
          fi
          echo "NetworkPolicy enforcement passed: configured origin reachable; unrelated Services blocked; extraEgress CIDR allowed and non-allow-listed external IP blocked."
      - name: Collect diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl get networkpolicy -A -o yaml || true
          kubectl get events -A --sort-by=.lastTimestamp || true
          kubectl logs -n kube-system daemonset/calico-node --tail=100 || true