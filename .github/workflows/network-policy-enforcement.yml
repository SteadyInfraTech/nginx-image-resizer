name: Network policy enforcement

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  network-policy-enforcement:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: Create kind cluster without default CNI
        run: |
          cat > "$RUNNER_TEMP/kind-network-policy.yaml" <<'YAML'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          networking:
            disableDefaultCNI: true
            podSubnet: 192.168.0.0/16
          YAML
          kind create cluster --name network-policy --config "$RUNNER_TEMP/kind-network-policy.yaml" --wait 120s
      - name: Install Calico policy-enforcing CNI
        run: |
          kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.29.3/manifests/calico.yaml
          kubectl rollout status daemonset/calico-node -n kube-system --timeout=240s
          kubectl rollout status deployment/calico-kube-controllers -n kube-system --timeout=240s
      - name: Build and load test images
        run: |
          docker build -t steady-image-resizer:ci .
          docker build -f demo/Dockerfile -t steady-image-resizer-demo-origin:ci .
          kind load docker-image --name network-policy steady-image-resizer:ci
          kind load docker-image --name network-policy steady-image-resizer-demo-origin:ci
      - name: Deploy allowed and disallowed destinations with enforced policy
        run: |
          set -eu
          kubectl create deployment origin --image=steady-image-resizer-demo-origin:ci
          kubectl expose deployment origin --port=8081 --target-port=8081
          kubectl create deployment blocked --image=steady-image-resizer-demo-origin:ci
          kubectl expose deployment blocked --port=8081 --target-port=8081
          kubectl rollout status deployment/origin --timeout=120s
          kubectl rollout status deployment/blocked --timeout=120s
          helm upgrade --install resizer charts/nginx-image-resizer \
            --set image.repository=steady-image-resizer \
            --set image.tag=ci \
            --set image.pullPolicy=IfNotPresent \
            --set origin.host=origin \
            --set networkPolicy.enabled=true \
            --set networkPolicy.origin.podLabels.app=origin \
            --set-json 'networkPolicy.origin.namespaceLabels={"kubernetes.io/metadata.name":"default"}' \
            --wait --timeout=180s
          kubectl rollout status deployment/resizer-nginx-image-resizer --timeout=120s
      - name: Verify allowed origin and DNS work, while unrelated destination is blocked
        run: |
          set -eu
          pod="$(kubectl get pods -l app.kubernetes.io/instance=resizer,app.kubernetes.io/name=nginx-image-resizer -o jsonpath='{.items[0].metadata.name}')"
          test -n "$pod"
          # A real resize proves DNS and egress to the configured origin are allowed.
          kubectl port-forward service/resizer-nginx-image-resizer 18080:8080 > "$RUNNER_TEMP/port-forward.log" 2>&1 &
          port_forward_pid=$!
          trap 'kill "$port_forward_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = "1"
          curl -fsS -o "$RUNNER_TEMP/resize.png" http://127.0.0.1:18080/77x77/sample.png
          python3 - "$RUNNER_TEMP/resize.png" <<'PY'
          import struct, sys
          data = open(sys.argv[1], "rb").read()
          assert data[:8] == bytes.fromhex("89504e470d0a1a0a"), "allowed origin did not return PNG"
          width, height = struct.unpack(">II", data[16:24])
          assert (width, height) == (77, 57), f"unexpected dimensions: {width}x{height}"
          PY
          # BusyBox wget is present in the Alpine-based upstream NGINX image.
          # DNS may resolve the blocked Service, but its TCP connection must time out/fail.
          if kubectl exec "$pod" -- wget -T 4 -qO- http://blocked:8081/sample.png > /dev/null 2>&1; then
            echo "NetworkPolicy regression: resizer reached a disallowed destination" >&2
            exit 1
          fi
          echo "NetworkPolicy enforcement passed: configured origin reachable; unrelated Service blocked."
      - name: Collect diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl get networkpolicy -A -o yaml || true
          kubectl get events -A --sort-by=.lastTimestamp || true
          kubectl logs -n kube-system daemonset/calico-node --tail=100 || true