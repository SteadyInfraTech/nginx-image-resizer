name: Benchmark unit tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  benchmark-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run benchmark unit tests
        run: python3 -m unittest discover -s tests -p 'test_benchmark.py' -v
