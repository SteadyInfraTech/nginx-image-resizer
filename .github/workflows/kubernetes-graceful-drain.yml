name: Kubernetes graceful drain

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kubernetes-graceful-drain:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: Create kind cluster
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: graceful-drain
      - name: Build and load application and origin images
        run: |
          docker build -t steady-image-resizer:drain .
          docker build -f demo/Dockerfile -t steady-image-resizer-demo-origin:drain .
          kind load docker-image --name graceful-drain steady-image-resizer:drain
          kind load docker-image --name graceful-drain steady-image-resizer-demo-origin:drain
      - name: Install origin, resizer, and in-cluster client
        run: |
          set -eu
          kubectl create deployment origin --image=steady-image-resizer-demo-origin:drain
          kubectl expose deployment origin --port=8081 --target-port=8081
          kubectl rollout status deployment/origin --timeout=120s
          helm upgrade --install resizer charts/nginx-image-resizer \
            --set image.repository=steady-image-resizer \
            --set image.tag=drain \
            --set image.pullPolicy=IfNotPresent \
            --set origin.host=origin \
            --set replicaCount=1
          kubectl rollout status deployment/resizer-nginx-image-resizer --timeout=120s
          kubectl run drain-client --image=curlimages/curl:8.12.1 --restart=Never --command -- sh -c 'sleep 300'
          kubectl wait --for=condition=Ready pod/drain-client --timeout=120s
      - name: Delete pod during a slow in-flight request and verify graceful completion
        shell: bash
        run: |
          set -euo pipefail
          pod="$(kubectl get pods -l app.kubernetes.io/instance=resizer -o jsonpath='{.items[0].metadata.name}')"
          test -n "$pod"
          kubectl exec drain-client -- sh -c 'curl --max-time 15 -sS -D /tmp/headers -o /tmp/body -w "%{http_code}" "http://resizer-nginx-image-resizer:8080/77x77/slow-shutdown.png?bypass_cache=1" > /tmp/status; echo $? > /tmp/exit' > "$RUNNER_TEMP/request.log" 2>&1 &
          request_pid=$!
          cleanup() {
            kill "$request_pid" 2>/dev/null || true
            kubectl logs deployment/origin --tail=50 || true
            kubectl logs deployment/resizer-nginx-image-resizer --all-containers=true --tail=100 || true
          }
          trap cleanup EXIT
          started=0
          for attempt in $(seq 1 60); do
            if kubectl logs deployment/origin 2>&1 | grep -q 'slow shutdown request started'; then started=1; break; fi
            sleep 0.2
          done
          test "$started" = "1"
          kubectl delete pod "$pod" --wait=false
          wait "$request_pid"
          test "$(kubectl exec drain-client -- cat /tmp/exit)" = "0"
          test "$(kubectl exec drain-client -- cat /tmp/status)" = "200"
          kubectl exec drain-client -- grep -qi '^X-Cache-Status: BYPASS' /tmp/headers
          kubectl exec drain-client -- cat /tmp/body > "$RUNNER_TEMP/drained.png"
          python3 - "$RUNNER_TEMP/drained.png" <<'PY'
          import struct, sys
          data = open(sys.argv[1], "rb").read()
          assert data[:8] == bytes.fromhex("89504e470d0a1a0a"), "response is not PNG"
          width, height = struct.unpack(">II", data[16:24])
          assert (width, height) == (77, 57), f"unexpected dimensions: {width}x{height}"
          print(f"Kubernetes graceful drain passed: in-flight request completed ({width}x{height})")
          PY
          kubectl rollout status deployment/resizer-nginx-image-resizer --timeout=120s
          kubectl wait --for=condition=Ready pod -l app.kubernetes.io/instance=resizer --timeout=120s
          kubectl exec drain-client -- curl -fsS http://resizer-nginx-image-resizer:8080/healthz
