name: Helm packaged chart smoke

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  helm-packaged-chart:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: Validate metadata and package chart
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            python3 tools/validate_chart_release.py --expected-app-version "${GITHUB_REF_NAME#v}"
          else
            python3 tools/validate_chart_release.py
          fi
          mkdir -p "$RUNNER_TEMP/chart"
          helm lint charts/nginx-image-resizer
          helm package charts/nginx-image-resizer --destination "$RUNNER_TEMP/chart"
          chart_version="$(sed -n 's/^version: *//p' charts/nginx-image-resizer/Chart.yaml | tr -d '"')"
          chart_archive="$RUNNER_TEMP/chart/nginx-image-resizer-$chart_version.tgz"
          test -s "$chart_archive"
          helm show chart "$chart_archive"
          helm template resizer "$chart_archive" --set origin.host=origin --set image.tag=ci > "$RUNNER_TEMP/packaged-render.yaml"
          grep -q 'image_filter resize' "$RUNNER_TEMP/packaged-render.yaml"
      - name: Create kind cluster
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: packaged-chart
      - name: Build and load test images
        run: |
          docker build -t steady-image-resizer:ci .
          docker build -f demo/Dockerfile -t steady-image-resizer-demo-origin:ci .
          kind load docker-image --name packaged-chart steady-image-resizer:ci
          kind load docker-image --name packaged-chart steady-image-resizer-demo-origin:ci
      - name: Install the packaged chart and verify resize/cache behavior
        shell: bash
        run: |
          set -euo pipefail
          chart_archive="$(find "$RUNNER_TEMP/chart" -maxdepth 1 -name 'nginx-image-resizer-*.tgz' -print -quit)"
          test -n "$chart_archive"
          kubectl create deployment origin --image=steady-image-resizer-demo-origin:ci
          kubectl expose deployment origin --port=8081 --target-port=8081
          kubectl rollout status deployment/origin --timeout=120s
          helm upgrade --install resizer "$chart_archive" \
            --set image.repository=steady-image-resizer \
            --set image.tag=ci \
            --set image.pullPolicy=IfNotPresent \
            --set origin.host=origin \
            --set replicaCount=1 \
            --wait --timeout=180s
          kubectl rollout status deployment/resizer-nginx-image-resizer --timeout=120s

          kubectl port-forward service/resizer-nginx-image-resizer 18080:8080 > "$RUNNER_TEMP/port-forward.log" 2>&1 &
          port_forward_pid=$!
          cleanup() {
            kill "$port_forward_pid" 2>/dev/null || true
            wait "$port_forward_pid" 2>/dev/null || true
            kubectl get pods -o wide || true
            kubectl logs deployment/resizer-nginx-image-resizer --all-containers=true --tail=100 || true
          }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = "1"
          curl -fsS -D "$RUNNER_TEMP/first.headers" -o "$RUNNER_TEMP/resized.png" http://127.0.0.1:18080/77x77/sample.png
          grep -qi '^X-Cache-Status: MISS' "$RUNNER_TEMP/first.headers"
          curl -fsS -D "$RUNNER_TEMP/second.headers" -o "$RUNNER_TEMP/resized-again.png" http://127.0.0.1:18080/77x77/sample.png
          grep -qi '^X-Cache-Status: HIT' "$RUNNER_TEMP/second.headers"
          cmp "$RUNNER_TEMP/resized.png" "$RUNNER_TEMP/resized-again.png"
          python3 - "$RUNNER_TEMP/resized.png" <<'PY'
          import struct, sys
          data = open(sys.argv[1], "rb").read()
          assert data[:8] == bytes.fromhex("89504e470d0a1a0a"), "response is not PNG"
          width, height = struct.unpack(">II", data[16:24])
          assert (width, height) == (77, 57), f"unexpected dimensions: {width}x{height}"
          print(f"packaged chart passed: {width}x{height}, cache MISS/HIT verified")
          PY
      - name: Upload immutable packaged chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: nginx-image-resizer-helm-chart
          path: ${{ runner.temp }}/chart/nginx-image-resizer-*.tgz
          if-no-files-found: error
          retention-days: 90
      - name: Diagnose Kubernetes failures
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl get events --sort-by=.lastTimestamp || true
          kubectl describe pods || true
          kubectl logs deployment/resizer-nginx-image-resizer --all-containers=true --tail=200 || true
          kubectl logs deployment/origin --all-containers=true --tail=100 || true
