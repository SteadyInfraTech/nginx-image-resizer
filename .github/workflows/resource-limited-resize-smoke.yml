name: Resource-limited resize smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resource-limited-resize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure bounded resources
        run: |
          cat > "$RUNNER_TEMP/limits.yml" <<'YAML'
          services:
            nginx:
              mem_limit: 128m
              memswap_limit: 128m
              cpus: 0.5
          YAML
          docker compose -f docker-compose.yml -f "$RUNNER_TEMP/limits.yml" config > "$RUNNER_TEMP/rendered.yml"
          grep -q 'mem_limit: 134217728' "$RUNNER_TEMP/rendered.yml"
          grep -q 'memswap_limit: 134217728' "$RUNNER_TEMP/rendered.yml"
          grep -q 'cpus: 0.5' "$RUNNER_TEMP/rendered.yml"
      - name: Start bounded resizer and origin
        run: |
          set -eu
          compose="docker compose -f docker-compose.yml -f $RUNNER_TEMP/limits.yml"
          NGINX_CACHE_VALIDITY=10m NGINX_CACHE_TMPFS_SIZE=32m docker compose -f docker-compose.yml -f "$RUNNER_TEMP/limits.yml" up --build -d nginx origin
          origin_ready=0
          for attempt in $(seq 1 30); do
            if docker compose exec -T origin python -c 'from urllib.request import urlopen; r=urlopen("http://127.0.0.1:8081/sample.png", timeout=1); assert r.status == 200; r.read(8)' >/dev/null 2>&1; then origin_ready=1; break; fi
            sleep 1
          done
          test "$origin_ready" = "1"
          nginx_ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null; then nginx_ready=1; break; fi
            sleep 1
          done
          test "$nginx_ready" = "1"
          docker inspect "$(docker compose -f docker-compose.yml -f "$RUNNER_TEMP/limits.yml" ps -q nginx)" --format '{{.HostConfig.Memory}} {{.HostConfig.MemorySwap}} {{.HostConfig.NanoCpus}}' | grep -qx '134217728 134217728 500000000'
      - name: Resize cold variants under the resource cap
        run: |
          python3 - <<'PY'
          import concurrent.futures
          import struct
          from urllib.request import urlopen

          def check(i):
              w, h = 61 + i % 17, 47 + i % 13
              url = f"http://127.0.0.1:8080/{w}x{h}/sample.png?resource-smoke={i}&bypass_cache=1"
              with urlopen(url, timeout=10) as r:
                  body = r.read()
                  assert r.status == 200 and r.headers.get("Content-Type", "").startswith("image/png")
              assert body[:8] == bytes.fromhex("89504e470d0a1a0a")
              rw, rh = struct.unpack(">II", body[16:24])
              assert 0 < rw <= w and 0 < rh <= h, (i, rw, rh)
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              list(pool.map(check, range(80)))
          print("80 cold transformations passed at concurrency 8 under 128 MiB and 0.5 CPU limits")
          PY
          curl -fsS http://127.0.0.1:8080/healthz >/dev/null
          test "$(docker inspect "$(docker compose -f docker-compose.yml -f "$RUNNER_TEMP/limits.yml" ps -q nginx)" --format '{{.State.Running}}')" = true
          test "$(docker inspect "$(docker compose -f docker-compose.yml -f "$RUNNER_TEMP/limits.yml" ps -q nginx)" --format '{{.State.OOMKilled}}')" = false
      - name: Diagnostics on failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f "$RUNNER_TEMP/limits.yml" ps || true
          docker compose -f docker-compose.yml -f "$RUNNER_TEMP/limits.yml" logs --no-color || true
          docker stats --no-stream || true
      - name: Clean up
        if: always()
        run: docker compose -f docker-compose.yml -f "$RUNNER_TEMP/limits.yml" down --volumes --remove-orphans
