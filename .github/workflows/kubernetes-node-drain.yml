name: Kubernetes node drain

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kubernetes-node-drain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: Lint chart and verify disruption budget defaults and schema
        run: |
          set -eu
          helm lint charts/nginx-image-resizer
          helm template resizer charts/nginx-image-resizer > "$RUNNER_TEMP/default.yaml"
          if grep -q '^kind: PodDisruptionBudget$' "$RUNNER_TEMP/default.yaml"; then
            echo "PDB must remain disabled by default" >&2
            exit 1
          fi
          helm template resizer charts/nginx-image-resizer --set podDisruptionBudget.enabled=true --set podDisruptionBudget.minAvailable=1 > "$RUNNER_TEMP/pdb.yaml"
          grep -q '^kind: PodDisruptionBudget$' "$RUNNER_TEMP/pdb.yaml"
          grep -q 'minAvailable: 1' "$RUNNER_TEMP/pdb.yaml"
          if helm template resizer charts/nginx-image-resizer --set podDisruptionBudget.minAvailable=-1 > /dev/null 2>&1; then
            echo "negative PDB minAvailable unexpectedly passed schema validation" >&2
            exit 1
          fi
      - name: Create multi-node kind cluster
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: node-drain
          config: .github/kind-node-drain.yaml
      - name: Build and load application and origin images
        run: |
          docker build -t steady-image-resizer:node-drain .
          docker build -f demo/Dockerfile -t steady-image-resizer-demo-origin:node-drain .
          kind load docker-image --name node-drain steady-image-resizer:node-drain
          kind load docker-image --name node-drain steady-image-resizer-demo-origin:node-drain
      - name: Install origin and resizer with disruption protection
        run: |
          set -eu
          kubectl label node node-drain-worker drain-test=true
          kubectl label node node-drain-worker2 drain-test=true
          kubectl create deployment origin --image=steady-image-resizer-demo-origin:node-drain
          # Keep the origin off the worker being drained; the control-plane is tainted by kind.
          kubectl patch deployment origin --type=merge -p='{"spec":{"template":{"spec":{"nodeSelector":{"kubernetes.io/hostname":"node-drain-worker2"}}}}}'
          kubectl expose deployment origin --port=8081 --target-port=8081
          kubectl rollout status deployment/origin --timeout=120s
          helm upgrade --install resizer charts/nginx-image-resizer \
            --set image.repository=steady-image-resizer \
            --set image.tag=node-drain \
            --set image.pullPolicy=IfNotPresent \
            --set origin.host=origin \
            --set replicaCount=2 \
            --set podDisruptionBudget.enabled=true \
            --set podDisruptionBudget.minAvailable=1 \
            --set-string nodeSelector.drain-test=true \
            --wait --timeout=180s
          # Prefer spreading replicas across workers, without blocking rescheduling onto the surviving worker.
          kubectl patch deployment resizer-nginx-image-resizer --type=merge -p='{"spec":{"template":{"spec":{"topologySpreadConstraints":[{"maxSkew":1,"topologyKey":"kubernetes.io/hostname","whenUnsatisfiable":"ScheduleAnyway","labelSelector":{"matchLabels":{"app.kubernetes.io/instance":"resizer","app.kubernetes.io/name":"nginx-image-resizer"}}}]}}}}'
          kubectl rollout status deployment/resizer-nginx-image-resizer --timeout=180s
          # Rollout status can finish while old ReplicaSet pods are still terminating.
          # Wait for the PDB and placement to converge before asserting the drain baseline.
          baseline_ready=0
          for attempt in $(seq 1 60); do
            expected_pods="$(kubectl get pdb resizer-nginx-image-resizer -o jsonpath='{.status.expectedPods}')"
            disruptions_allowed="$(kubectl get pdb resizer-nginx-image-resizer -o jsonpath='{.status.disruptionsAllowed}')"
            node_count="$(kubectl get pods -l app.kubernetes.io/instance=resizer -o jsonpath='{.items[*].spec.nodeName}' | tr ' ' '\n' | sort -u | wc -l | tr -d ' ')"
            if [ "$expected_pods" = "2" ] && [ "$disruptions_allowed" = "1" ] && [ "$node_count" = "2" ]; then
              baseline_ready=1
              break
            fi
            sleep 1
          done
          test "$baseline_ready" = "1"
          # ScheduleAnyway prefers one replica per worker but still permits the
          # evicted replica to return to the surviving worker during a drain.
          kubectl wait --for=jsonpath='{.status.readyReplicas}'=2 deployment/resizer-nginx-image-resizer --timeout=120s
          kubectl wait --for=jsonpath='{.status.disruptionsAllowed}'=1 pdb/resizer-nginx-image-resizer --timeout=60s
          # Count only ready, non-terminating resizer pods. Require one on the
          # worker about to be drained and one on the surviving worker, so this
          # test cannot pass without evicting a live resizer replica.
          kubectl get pods -l app.kubernetes.io/instance=resizer -o json |
            python3 -c 'import json,sys
          pods=json.load(sys.stdin)["items"]
          ready=[]
          for pod in pods:
              meta=pod["metadata"]
              status=pod.get("status", {})
              if meta.get("deletionTimestamp") is not None or status.get("phase") != "Running":
                  continue
              conditions=status.get("conditions", [])
              if any(c.get("type") == "Ready" and c.get("status") == "True" for c in conditions):
                  ready.append(pod.get("spec", {}).get("nodeName"))
          nodes=set(ready)
          assert "node-drain-worker" in nodes, f"no ready non-terminating resizer pod on drain target: {ready}"
          assert "node-drain-worker2" in nodes, f"no ready non-terminating resizer pod on surviving worker: {ready}"
          assert len(nodes) == 2, f"expected ready resizer pods on exactly two workers, got {ready}"'
      - name: Drain a worker while continuously checking image delivery
        shell: bash
        run: |
          set -euo pipefail
          node="node-drain-worker"
          kubectl get pods -l app.kubernetes.io/instance=resizer -o wide
          # Hold the drain open long enough to prove probes run inside the eviction window.
          cat <<'EOF' | kubectl apply -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: drain-window
          spec:
            nodeSelector:
              kubernetes.io/hostname: node-drain-worker
            restartPolicy: Never
            containers:
              - name: hold
                image: steady-image-resizer:node-drain
                imagePullPolicy: IfNotPresent
                command: ["sh", "-c", "sleep 3600"]
                lifecycle:
                  preStop:
                    exec:
                      command: ["sh", "-c", "sleep 10"]
          EOF
          kubectl wait --for=condition=Ready pod/drain-window --timeout=60s
          kubectl drain "$node" --ignore-daemonsets --delete-emptydir-data --force --timeout=180s > "$RUNNER_TEMP/drain.log" 2>&1 &
          drain_pid=$!
          # Do not start the request assertions until kubectl has cordoned the node.
          for attempt in $(seq 1 60); do
            if [ "$(kubectl get node "$node" -o jsonpath='{.spec.unschedulable}')" = "true" ]; then
              break
            fi
            if ! kill -0 "$drain_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/drain.log" >&2 || true
              echo "Drain finished before the node was cordoned" >&2
              exit 1
            fi
            sleep 0.25
          done
          test "$(kubectl get node "$node" -o jsonpath='{.spec.unschedulable}')" = "true"
          successes=0
          while kill -0 "$drain_pid" 2>/dev/null; do
            request_id=$((successes + 1))
            if kubectl exec deployment/origin -- python -c "import struct; from urllib.request import urlopen; data=urlopen('http://resizer-nginx-image-resizer:8080/77x77/sample.png?node-drain=$request_id', timeout=8).read(); assert data[:8] == bytes.fromhex('89504e470d0a1a0a'), 'response is not PNG'; width,height=struct.unpack('>II', data[16:24]); assert (width,height)==(77,57), f'unexpected dimensions: {width}x{height}'"; then
              successes=$((successes + 1))
            else
              echo "Image request $request_id failed while node drain was active" >&2
              cat "$RUNNER_TEMP/drain.log" >&2 || true
              exit 1
            fi
            sleep 0.25
          done
          wait "$drain_pid"
          test "$successes" -ge 5
          kubectl rollout status deployment/resizer-nginx-image-resizer --timeout=180s
          test "$(kubectl get deployment resizer-nginx-image-resizer -o jsonpath='{.status.readyReplicas}')" = "2"
          test "$(kubectl get pdb resizer-nginx-image-resizer -o jsonpath='{.status.disruptionsAllowed}')" = "1"
          kubectl exec deployment/origin -- python -c "import struct; from urllib.request import urlopen; data=urlopen('http://resizer-nginx-image-resizer:8080/77x77/sample.png?after-node-drain=1', timeout=8).read(); assert data[:8] == bytes.fromhex('89504e470d0a1a0a'); width,height=struct.unpack('>II', data[16:24]); assert (width,height)==(77,57)"
          echo "Node drain passed: $successes image requests succeeded during the active drain and two replicas recovered."
      - name: Diagnose node-drain failures
        if: failure()
        run: |
          kubectl get nodes -o wide || true
          kubectl get pods -o wide || true
          kubectl get pdb -o yaml || true
          kubectl get events --sort-by=.lastTimestamp || true
          kubectl logs deployment/resizer-nginx-image-resizer --all-containers=true --tail=200 || true
          kubectl logs deployment/origin --all-containers=true --tail=100 || true
