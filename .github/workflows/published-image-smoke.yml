name: Published image Helm smoke

on:
  pull_request:
  workflow_dispatch:
  workflow_run:
    workflows: ["Publish container image"]
    types: [completed]

permissions:
  contents: read

jobs:
  published-image-smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: Verify anonymous GHCR pull
        run: docker pull ghcr.io/steadyinfratech/nginx-image-resizer:main
      - name: Create kind cluster
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: published-image-resizer
      - name: Build and load test-origin image
        run: |
          docker build -f demo/Dockerfile -t steady-image-resizer-demo-origin:ci .
          kind load docker-image --name published-image-resizer steady-image-resizer-demo-origin:ci
      - name: Install origin and published application image
        run: |
          set -eu
          kubectl create deployment origin --image=steady-image-resizer-demo-origin:ci
          kubectl expose deployment origin --port=8081 --target-port=8081
          kubectl rollout status deployment/origin --timeout=120s
          helm upgrade --install resizer charts/nginx-image-resizer \
            --set image.repository=ghcr.io/steadyinfratech/nginx-image-resizer \
            --set image.tag=main \
            --set image.pullPolicy=Always \
            --set origin.host=origin \
            --set uriStyle=prefix \
            --set replicaCount=1 \
            --wait --timeout=180s
          kubectl rollout status deployment/resizer-nginx-image-resizer --timeout=120s
      - name: Verify health, resize, cache, and both URI styles
        run: |
          set -eu
          port_forward_pid=""
          start_port_forward() {
            if [ -n "$port_forward_pid" ]; then
              kill "$port_forward_pid" 2>/dev/null || true
              wait "$port_forward_pid" 2>/dev/null || true
            fi
            kubectl port-forward service/resizer-nginx-image-resizer 18080:8080 > "$RUNNER_TEMP/port-forward.log" 2>&1 &
            port_forward_pid=$!
            ready=0
            for attempt in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:18080/healthz >/dev/null; then ready=1; break; fi
              sleep 1
            done
            test "$ready" = "1"
          }
          cleanup() {
            if [ -n "$port_forward_pid" ]; then
              kill "$port_forward_pid" 2>/dev/null || true
              wait "$port_forward_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          # Verify the backwards-compatible default route against the published GHCR image.
          start_port_forward
          curl -fsS -D "$RUNNER_TEMP/prefix-first.headers" -o "$RUNNER_TEMP/prefix.png" http://127.0.0.1:18080/77x77/sample.png
          grep -qi '^X-Cache-Status: MISS' "$RUNNER_TEMP/prefix-first.headers"
          curl -fsS -D "$RUNNER_TEMP/prefix-second.headers" -o "$RUNNER_TEMP/prefix-again.png" http://127.0.0.1:18080/77x77/sample.png
          grep -qi '^X-Cache-Status: HIT' "$RUNNER_TEMP/prefix-second.headers"
          cmp "$RUNNER_TEMP/prefix.png" "$RUNNER_TEMP/prefix-again.png"
          python3 - "$RUNNER_TEMP/prefix.png" <<'PY'
          import struct, sys
          data = open(sys.argv[1], "rb").read()
          assert data[:8] == bytes.fromhex("89504e470d0a1a0a"), "prefix response is not PNG"
          width, height = struct.unpack(">II", data[16:24])
          assert (width, height) == (77, 57), f"unexpected prefix dimensions: {width}x{height}"
          print(f"published image prefix route passed: {width}x{height}, cache MISS/HIT verified")
          PY

          # Switch the chart-rendered route and restart port-forward after the rollout.
          helm upgrade resizer charts/nginx-image-resizer \
            --set image.repository=ghcr.io/steadyinfratech/nginx-image-resizer \
            --set image.tag=main \
            --set image.pullPolicy=Always \
            --set origin.host=origin \
            --set uriStyle=suffix \
            --set replicaCount=1 \
            --wait --timeout=180s
          kubectl rollout status deployment/resizer-nginx-image-resizer --timeout=120s
          start_port_forward
          curl -fsS -D "$RUNNER_TEMP/suffix-first.headers" -o "$RUNNER_TEMP/suffix.png" http://127.0.0.1:18080/sample.png/_resize/77x77
          grep -qi '^X-Cache-Status: MISS' "$RUNNER_TEMP/suffix-first.headers"
          curl -fsS -D "$RUNNER_TEMP/suffix-second.headers" -o "$RUNNER_TEMP/suffix-again.png" http://127.0.0.1:18080/sample.png/_resize/77x77
          grep -qi '^X-Cache-Status: HIT' "$RUNNER_TEMP/suffix-second.headers"
          cmp "$RUNNER_TEMP/suffix.png" "$RUNNER_TEMP/suffix-again.png"
          python3 - "$RUNNER_TEMP/suffix.png" <<'PY'
          import struct, sys
          data = open(sys.argv[1], "rb").read()
          assert data[:8] == bytes.fromhex("89504e470d0a1a0a"), "suffix response is not PNG"
          width, height = struct.unpack(">II", data[16:24])
          assert (width, height) == (77, 57), f"unexpected suffix dimensions: {width}x{height}"
          print(f"published image suffix route passed: {width}x{height}, cache MISS/HIT verified")
          PY
      - name: Diagnose Kubernetes startup failures
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl get events --sort-by=.lastTimestamp || true
          kubectl describe pods || true
          kubectl logs deployment/resizer-nginx-image-resizer --all-containers=true --tail=200 || true
          kubectl logs deployment/origin --all-containers=true --tail=100 || true
