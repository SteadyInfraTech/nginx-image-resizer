name: Origin outage recovery

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  origin-outage-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Expire the warm entry quickly so the outage test exercises stale-on-error,
      # rather than merely returning a still-fresh cache hit.
      NGINX_CACHE_VALIDITY: 2s
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build and start NGINX with the test origin
        run: |
          docker compose up --build -d origin nginx
          # NGINX healthz does not prove the upstream origin is accepting requests.
          # Wait for the origin fixture itself before testing the baseline image fetch.
          origin_ready=0
          for attempt in $(seq 1 30); do
            if docker compose exec -T origin python -c 'from urllib.request import urlopen; r=urlopen("http://127.0.0.1:8081/sample.png", timeout=1); assert r.status == 200; r.read(8)' >/dev/null 2>&1; then
              origin_ready=1
              break
            fi
            sleep 1
          done
          test "$origin_ready" = "1"
          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = "1"
          # Establish the fixture works before inducing the connection failure.
          status="$(curl -sS -o "$RUNNER_TEMP/baseline.png" -w '%{http_code}' 'http://127.0.0.1:8080/77x77/sample.png?origin-recovery=baseline')"
          test "$status" = "200"
          python3 - "$RUNNER_TEMP/baseline.png" <<'PY'
          import struct, sys
          data = open(sys.argv[1], "rb").read()
          assert data[:8] == bytes.fromhex("89504e470d0a1a0a"), "baseline response is not PNG"
          assert struct.unpack(">II", data[16:24]) == (77, 57), "baseline dimensions differ"
          PY

          # Warm a second cache key that must remain usable during the outage.
          status="$(curl -sS -D "$RUNNER_TEMP/stale-baseline.headers" -o "$RUNNER_TEMP/stale-baseline.png" -w '%{http_code}' 'http://127.0.0.1:8080/77x77/sample.png?origin-recovery=stale')"
          test "$status" = "200"
          grep -qi '^X-Cache-Status: MISS' "$RUNNER_TEMP/stale-baseline.headers"
          python3 - "$RUNNER_TEMP/stale-baseline.png" <<'PY'
          import struct, sys
          data = open(sys.argv[1], "rb").read()
          assert data[:8] == bytes.fromhex("89504e470d0a1a0a"), "stale baseline response is not PNG"
          assert struct.unpack(">II", data[16:24]) == (77, 57), "stale baseline dimensions differ"
          PY
          # The 2-second cache TTL is intentional: wait until the entry is stale
          # before killing the origin, so the next successful response proves
          # proxy_cache_use_stale is working during an upstream failure.
          sleep 3

      - name: Verify repeated failures during an origin outage
        run: |
          set -eu
          # A stopped container may leave a stale endpoint in Docker's network until
          # endpoint cleanup completes. Both an immediate refusal (502) and a connect
          # timeout (504) are valid outage responses; the dedicated timeout test asserts 504.
          docker compose kill origin
          # An expired-but-cached image must still be served while the origin is down.
          # A STALE cache status confirms this was not a fresh HIT.
          stale_status="$(curl --max-time 8 -sS -D "$RUNNER_TEMP/stale-during-outage.headers" -o "$RUNNER_TEMP/stale-during-outage.png" -w '%{http_code}' 'http://127.0.0.1:8080/77x77/sample.png?origin-recovery=stale')"
          test "$stale_status" = "200"
          grep -qi '^X-Cache-Status: STALE' "$RUNNER_TEMP/stale-during-outage.headers"
          cmp "$RUNNER_TEMP/stale-baseline.png" "$RUNNER_TEMP/stale-during-outage.png"
          python3 - "$RUNNER_TEMP/stale-during-outage.png" <<'PY'
          import struct, sys
          data = open(sys.argv[1], "rb").read()
          assert data[:8] == bytes.fromhex("89504e470d0a1a0a"), "stale outage response is not PNG"
          assert struct.unpack(">II", data[16:24]) == (77, 57), "stale outage dimensions differ"
          PY
          # Repeat the same cold-key request across a bounded outage window. This checks
          # that failures remain bounded and do not poison the response cache.
          for attempt in $(seq 1 5); do
            status="$(curl --max-time 8 -sS -o "$RUNNER_TEMP/origin-down.body" -w '%{http_code}' 'http://127.0.0.1:8080/77x77/sample.png?origin-recovery=down')"
            echo "Origin outage attempt $attempt returned HTTP $status"
            case "$status" in
              502|504) ;;
              *) echo "Expected HTTP 502 or 504 during origin outage, got $status" >&2; exit 1 ;;
            esac
            if grep -q '89504e470d0a1a0a' "$RUNNER_TEMP/origin-down.body"; then
              echo "image response unexpectedly returned while origin was stopped" >&2
              exit 1
            fi
            if [ "$attempt" -lt 5 ]; then sleep 3; fi
          done

      - name: Verify service recovers when the origin returns
        run: |
          set -eu
          docker compose start origin
          origin_ready=0
          for attempt in $(seq 1 30); do
            if docker compose exec -T origin python -c 'from urllib.request import urlopen; r=urlopen("http://127.0.0.1:8081/sample.png", timeout=1); assert r.status == 200; r.read(8)' >/dev/null 2>&1; then
              origin_ready=1
              break
            fi
            sleep 1
          done
          test "$origin_ready" = "1"
          # Retry the exact cold key that failed. A cached error must not block recovery.
          status="$(curl --max-time 8 -sS -D "$RUNNER_TEMP/recovered.headers" -o "$RUNNER_TEMP/recovered.png" -w '%{http_code}' 'http://127.0.0.1:8080/77x77/sample.png?origin-recovery=down')"
          test "$status" = "200"
          grep -qi '^X-Cache-Status: MISS' "$RUNNER_TEMP/recovered.headers"
          python3 - "$RUNNER_TEMP/recovered.png" <<'PY'
          import struct, sys
          data = open(sys.argv[1], "rb").read()
          assert data[:8] == bytes.fromhex("89504e470d0a1a0a"), "recovered response is not PNG"
          assert struct.unpack(">II", data[16:24]) == (77, 57), "recovered dimensions differ"
          PY
          docker compose logs --no-color nginx origin

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color nginx origin

      - name: Clean up
        if: always()
        run: docker compose down --volumes --remove-orphans
