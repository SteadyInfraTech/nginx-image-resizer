name: Release artifact acceptance

on:
  workflow_dispatch:
    inputs:
      from_version:
        description: Previous published application version, without the leading v
        required: true
        type: string
      to_version:
        description: Newer published application version, without the leading v
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  install-upgrade-rollback:
    name: Published chart and image install, upgrade, rollback
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out test fixtures
        uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: Create clean kind cluster
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: release-acceptance
      - name: Validate version inputs and download published chart assets
        env:
          GH_TOKEN: ${{ github.token }}
          FROM_VERSION: ${{ inputs.from_version }}
          TO_VERSION: ${{ inputs.to_version }}
        run: |
          set -euo pipefail
          for version in "$FROM_VERSION" "$TO_VERSION"; do
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || {
              echo "Expected a semantic version without v, got: $version" >&2
              exit 1
            }
          done
          [[ "$FROM_VERSION" != "$TO_VERSION" ]] || {
            echo "from_version and to_version must differ" >&2
            exit 1
          }
          newest="$(printf '%s\\n' "$FROM_VERSION" "$TO_VERSION" | sort -V | tail -n1)"
          [[ "$newest" == "$TO_VERSION" ]] || {
            echo "to_version must be newer than from_version" >&2
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/release-charts/from" "$RUNNER_TEMP/release-charts/to"
          gh release download "v$FROM_VERSION" --repo "$GITHUB_REPOSITORY" \
            --pattern "nginx-image-resizer-$FROM_VERSION.tgz" --dir "$RUNNER_TEMP/release-charts/from"
          gh release download "v$FROM_VERSION" --repo "$GITHUB_REPOSITORY" \
            --pattern "nginx-image-resizer-$FROM_VERSION.tgz.sha256" --dir "$RUNNER_TEMP/release-charts/from"
          gh release download "v$TO_VERSION" --repo "$GITHUB_REPOSITORY" \
            --pattern "nginx-image-resizer-$TO_VERSION.tgz" --dir "$RUNNER_TEMP/release-charts/to"
          gh release download "v$TO_VERSION" --repo "$GITHUB_REPOSITORY" \
            --pattern "nginx-image-resizer-$TO_VERSION.tgz.sha256" --dir "$RUNNER_TEMP/release-charts/to"
          for version in "$FROM_VERSION" "$TO_VERSION"; do
            if [[ "$version" == "$FROM_VERSION" ]]; then dir="$RUNNER_TEMP/release-charts/from"; else dir="$RUNNER_TEMP/release-charts/to"; fi
            (cd "$dir" && sha256sum -c "nginx-image-resizer-$version.tgz.sha256")
            helm show chart "$dir/nginx-image-resizer-$version.tgz"
          done
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve published image tags to immutable digests
        id: images
        env:
          FROM_VERSION: ${{ inputs.from_version }}
          TO_VERSION: ${{ inputs.to_version }}
        run: |
          set -euo pipefail
          image=ghcr.io/steadyinfratech/nginx-image-resizer
          resolve_digest() {
            local version="$1" digest
            digest="$(docker buildx imagetools inspect "$image:$version" | awk '/^Digest:/ { print $2; exit }')"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "Could not resolve immutable digest for $image:$version" >&2
              return 1
            }
            printf '%s' "$digest"
          }
          from_digest="$(resolve_digest "$FROM_VERSION")"
          to_digest="$(resolve_digest "$TO_VERSION")"
          echo "from_digest=$from_digest" >> "$GITHUB_OUTPUT"
          echo "to_digest=$to_digest" >> "$GITHUB_OUTPUT"
          echo "from_image=$image@$from_digest" >> "$GITHUB_OUTPUT"
          echo "to_image=$image@$to_digest" >> "$GITHUB_OUTPUT"
          echo "$FROM_VERSION -> $image@$from_digest"
          echo "$TO_VERSION -> $image@$to_digest"
      - name: Build and load deterministic origin fixture
        run: |
          set -euo pipefail
          docker build -f demo/Dockerfile -t steady-image-resizer-demo-origin:release-acceptance .
          kind load docker-image --name release-acceptance steady-image-resizer-demo-origin:release-acceptance
          kubectl create deployment origin --image=steady-image-resizer-demo-origin:release-acceptance
          kubectl expose deployment origin --port=8081 --target-port=8081
          kubectl rollout status deployment/origin --timeout=120s
      - name: Install published release and verify resize plus cache
        env:
          VERSION: ${{ inputs.from_version }}
          DIGEST: ${{ steps.images.outputs.from_digest }}
        run: |
          set -euo pipefail
          helm upgrade --install resizer "$RUNNER_TEMP/release-charts/from/nginx-image-resizer-$VERSION.tgz" \
            --set image.repository=ghcr.io/steadyinfratech/nginx-image-resizer \
            --set image.tag="$VERSION" --set image.digest="$DIGEST" --set image.pullPolicy=IfNotPresent \
            --set origin.host=origin --set origin.port=8081 --set replicaCount=1 \
            --wait --timeout 5m
          kubectl rollout status deployment/resizer-nginx-image-resizer --timeout=120s
          kubectl port-forward service/resizer-nginx-image-resizer 18080:8080 > "$RUNNER_TEMP/port-forward.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/port-forward.pid"
          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = "1"
          echo "Installed v$VERSION with image digest $DIGEST"
          curl -fsS -D "$RUNNER_TEMP/first.headers" -o "$RUNNER_TEMP/resized.png" http://127.0.0.1:18080/77x77/sample.png
          grep -qi '^X-Cache-Status: MISS' "$RUNNER_TEMP/first.headers"
          curl -fsS -D "$RUNNER_TEMP/second.headers" -o "$RUNNER_TEMP/resized-again.png" http://127.0.0.1:18080/77x77/sample.png
          grep -qi '^X-Cache-Status: HIT' "$RUNNER_TEMP/second.headers"
          cmp "$RUNNER_TEMP/resized.png" "$RUNNER_TEMP/resized-again.png"
          python3 - "$RUNNER_TEMP/resized.png" <<'PY'
          import struct, sys
          data = open(sys.argv[1], "rb").read()
          assert data[:8] == bytes.fromhex("89504e470d0a1a0a"), "response is not PNG"
          width, height = struct.unpack(">II", data[16:24])
          assert (width, height) == (77, 57), f"unexpected dimensions: {width}x{height}"
          print(f"resize verified: {width}x{height}; cache MISS then HIT")
          PY
      - name: Upgrade to the newer published release and verify it
        env:
          VERSION: ${{ inputs.to_version }}
          DIGEST: ${{ steps.images.outputs.to_digest }}
        run: |
          set -euo pipefail
          helm upgrade resizer "$RUNNER_TEMP/release-charts/to/nginx-image-resizer-$VERSION.tgz" \
            --set image.repository=ghcr.io/steadyinfratech/nginx-image-resizer \
            --set image.tag="$VERSION" --set image.digest="$DIGEST" --set image.pullPolicy=IfNotPresent \
            --set origin.host=origin --set origin.port=8081 --set replicaCount=1 \
            --wait --timeout 5m
          kubectl rollout status deployment/resizer-nginx-image-resizer --timeout=120s
          # port-forward targets a pod; reconnect after rollout replaces it.
          kill "$(cat "$RUNNER_TEMP/port-forward.pid")" 2>/dev/null || true
          for attempt in $(seq 1 10); do
            if ! kill -0 "$(cat "$RUNNER_TEMP/port-forward.pid")" 2>/dev/null; then break; fi
            sleep 1
          done
          kubectl port-forward service/resizer-nginx-image-resizer 18080:8080 > "$RUNNER_TEMP/port-forward.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/port-forward.pid"
          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = "1"
          echo "Upgraded to v$VERSION with image digest $DIGEST"
          curl -fsS -D "$RUNNER_TEMP/upgrade-first.headers" -o "$RUNNER_TEMP/upgrade.png" http://127.0.0.1:18080/77x77/sample.png
          grep -qi '^X-Cache-Status: MISS' "$RUNNER_TEMP/upgrade-first.headers"
          curl -fsS -D "$RUNNER_TEMP/upgrade-second.headers" -o "$RUNNER_TEMP/upgrade-again.png" http://127.0.0.1:18080/77x77/sample.png
          grep -qi '^X-Cache-Status: HIT' "$RUNNER_TEMP/upgrade-second.headers"
          cmp "$RUNNER_TEMP/upgrade.png" "$RUNNER_TEMP/upgrade-again.png"
      - name: Roll back to the previous published release and verify it
        env:
          EXPECTED_DIGEST: ${{ steps.images.outputs.from_digest }}
        run: |
          set -euo pipefail
          helm rollback resizer 1 --wait --timeout 5m
          kubectl rollout status deployment/resizer-nginx-image-resizer --timeout=120s
          # Rollback replaces the pod as well, so refresh the port-forward target.
          kill "$(cat "$RUNNER_TEMP/port-forward.pid")" 2>/dev/null || true
          for attempt in $(seq 1 10); do
            if ! kill -0 "$(cat "$RUNNER_TEMP/port-forward.pid")" 2>/dev/null; then break; fi
            sleep 1
          done
          kubectl port-forward service/resizer-nginx-image-resizer 18080:8080 > "$RUNNER_TEMP/port-forward.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/port-forward.pid"
          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = "1"
          deployed_image="$(kubectl get deployment resizer-nginx-image-resizer -o jsonpath='{.spec.template.spec.containers[0].image}')"
          [[ "$deployed_image" == "ghcr.io/steadyinfratech/nginx-image-resizer@$EXPECTED_DIGEST" ]] || {
            echo "Rollback restored unexpected image: $deployed_image" >&2
            exit 1
          }
          curl -fsS -D "$RUNNER_TEMP/rollback-first.headers" -o "$RUNNER_TEMP/rollback.png" http://127.0.0.1:18080/77x77/sample.png
          grep -qi '^X-Cache-Status: MISS' "$RUNNER_TEMP/rollback-first.headers"
          curl -fsS -D "$RUNNER_TEMP/rollback-second.headers" -o "$RUNNER_TEMP/rollback-again.png" http://127.0.0.1:18080/77x77/sample.png
          grep -qi '^X-Cache-Status: HIT' "$RUNNER_TEMP/rollback-second.headers"
          cmp "$RUNNER_TEMP/rollback.png" "$RUNNER_TEMP/rollback-again.png"
          echo "Rollback restored immutable image digest $EXPECTED_DIGEST and resize/cache checks passed"
      - name: Diagnose failure
        if: failure()
        run: |
          kubectl get pods,services,endpoints -o wide || true
          kubectl get events --sort-by=.lastTimestamp || true
          kubectl describe pods || true
          kubectl logs deployment/resizer-nginx-image-resizer --all-containers=true --tail=200 || true
          kubectl logs deployment/origin --all-containers=true --tail=100 || true
          cat "$RUNNER_TEMP/port-forward.log" 2>/dev/null || true
      - name: Clean up port-forward
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/port-forward.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/port-forward.pid")" 2>/dev/null || true
          fi
